[temm1e]
mode = "local"

[gateway]
host = "127.0.0.1"
port = 8080
tls = false

[provider]
api_key = "sk-922f5a23a60a4756-kchvbk-b4ad3022"
base_url = "https://ninerouter-twxs.onrender.com/v1"
model = "kc/nvidia/nemotron-3.5-super-vl:free"

[agent]
# max_spend_usd = 0.0  # 0.0 = unlimited (default). Set a value to cap per-process spend.

[memory]
backend = "sqlite"

[memory.search]
vector_weight = 0.7
keyword_weight = 0.3

[vault]
backend = "local-chacha20"

[filestore]
backend = "local"

[security]
sandbox = "mandatory"
file_scanning = true
skill_signing = "required"
audit_log = true

[heartbeat]
enabled = false
interval = "30m"
checklist = "HEARTBEAT.md"
# report_to = ""  # Set to your Telegram chat ID for heartbeat reports

# System notifications — startup / shutdown messages to the owner.
# Default-off. When enabled with no [[notifications.recipients]] entries,
# the notifier falls back to heartbeat.report_to + your primary channel.
# [notifications]
# enabled = true
#
# [[notifications.recipients]]
# channel = "telegram"
# chat_id = "123456789"
#
# [[notifications.recipients]]
# channel = "discord"
# chat_id = "987654321"

[cron]
storage = "sqlite"

[tools]
shell = true
browser = true
file = true
git = true
cron = true
http = true

[observability]
log_level = "info"
otel_enabled = false

[channel.telegram]
enabled = true
token = "${TELEGRAM_BOT_TOKEN}"
allowlist = []
file_transfer = true

[channel.whatsapp_web]
enabled = true
token = "allowlist:ignore"
allowlist = []
file_transfer = true

[awareness]
enabled = true
confidence_threshold = 0
max_interventions_per_session = 10
observation_mode = "rules_first"
